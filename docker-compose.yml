services:
  db:
    image: postgres:16
    container_name: cbp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cbp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cbp_password}
      POSTGRES_DB: ${POSTGRES_DB:-customer_behavior}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cbp} -d ${POSTGRES_DB:-customer_behavior}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cbp_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./models_artifacts:/app/models_artifacts:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cbp_frontend
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./docs:/app/docs:ro
    depends_on:
      - api

volumes:
  pgdata:
